services:
  - type: web
    name: atlas-ai-financial-assistant
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: POSTGRES_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.aicredits.in/v1
      - key: MODEL_NAME
        value: gpt-4o-mini
      - key: FINNHUB_API_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
